<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Infografía | Oracle DB vs Microsoft SQL Server</title>

    <meta
      name="description"
      content="Infografía comparativa entre Oracle Database y Microsoft SQL Server"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        overflow-x: auto;
      }

      /* Centers image horizontally */
      body {
        min-width: 100vw;
      }

      .wrapper {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      img {
        display: block;
        height: auto;
        width: calc(100vw * var(--zoom, 1));
        max-width: none;
      }

      /* Floating controls */
      .controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
      }

      #zoomBtn {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: #222;
        color: white;
        cursor: pointer;
        font-size: 14px;
        opacity: 0.3;
        transition: opacity 0.2s ease;
      }

      #zoomBtn:hover,
      #zoomBtn:focus,
      #zoomBtn:active {
        opacity: 1;
      }
      #zoomBtn.active {
        opacity: 1;
      }

      .popup {
        display: none;
        margin-top: 8px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      }

      .popup.show {
        display: block;
      }

      select {
        width: 120px;
        padding: 6px;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <button id="zoomBtn">Zoom: 100%</button>

      <div class="popup" id="popup">
        <select id="zoomSelect">
          <option value="0.25">25%</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
        </select>
      </div>
    </div>

    <div class="wrapper">
      <img
        id="infografia"
        src="infografia.svg"
        alt="Infografía comparativa entre Oracle DB y Microsoft SQL Server"
      />
    </div>

    <script>
      const popup = document.getElementById("popup");
      const zoomBtn = document.getElementById("zoomBtn");
      const zoomSelect = document.getElementById("zoomSelect");

      zoomBtn.addEventListener("click", () => {
        popup.classList.toggle("show");
        zoomBtn.classList.toggle("active");
      });

      zoomSelect.addEventListener("change", () => {
        const zoom = zoomSelect.value;

        document.documentElement.style.setProperty("--zoom", zoom);

        zoomBtn.textContent =
          "Zoom: " + Math.round(parseFloat(zoom) * 100) + "%";
      });

      document.addEventListener("click", (e) => {
        if (!popup.contains(e.target) && e.target !== zoomBtn) {
          popup.classList.remove("show");
          zoomBtn.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
